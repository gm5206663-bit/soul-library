# SENTINEL — the library's own checks, run against a live kit checkout.
#
# Armed 2026-10-12. This is the first cross-repo workflow in the account: the
# sentinel's job is to compare the library against the kit (chapter counts,
# live edges, the D1 law: released kit == working copy), so CI checks the kit
# out beside this repository and hands it to the tool.
#
# WHY THIS EXISTS. The D1 law was broken from 2026-09-28 to 2026-10-12 and
# nobody could see it: the sentinel reported "1 fail" and exited 0, so any
# caller checking the exit code was told everything was fine. Both halves are
# fixed now — the kit's two trees are byte-identical again, and a failed check
# fails the run. This workflow is what makes the next drift visible the day it
# happens instead of two weeks later.
#
# TRIGGER COVERS WHAT THE CHECKS READ. sentinel.py reads this repo's data/,
# chapters/, site pages and the tools themselves; lint_continuity.py reads the
# kit's devouring-dragon chapters. Local paths are in the filter; the kit is a
# moving dependency across repositories, which is what the weekly schedule is
# for — a kit change can break this comparison with no push here at all.
#
# WHAT THIS DOES AND DOES NOT VERIFY — read this before trusting the badge.
# It runs tools/sentinel.py (26 checks: library data against the workspace,
# live edges, receipts, D1) and tools/lint_continuity.py (timeline, places,
# chapter coverage). It does not gate prose and does not gate the other
# serials' chapter text.

name: sentinel

on:
  push:
    paths:
      - 'tools/**'
      - 'data/**'
      - 'chapters/**'
      - '*.html'
      - '*.json'
      - '.github/workflows/sentinel.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'data/**'
      - 'chapters/**'
      - '*.html'
      - '*.json'
      - '.github/workflows/sentinel.yml'
  schedule:
    # Mondays 05:17 UTC — the kit moves without pushing here; check weekly.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sentinel:
    name: Sentinel against a live kit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the library
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check out the kit beside it
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: gm5206663-bit/soul-land-universal-kit
          path: kit
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Sentinel's own selftest
        run: python3 tools/sentinel.py --selftest

      - name: Sentinel (26 checks, exits 1 on any fail)
        run: python3 tools/sentinel.py --kit kit

      - name: Continuity lint
        run: python3 tools/lint_continuity.py kit

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-data
          path: sentinel_data.json
          if-no-files-found: warn
