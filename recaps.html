<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The story so far — The Soul Library</title>
<meta property="og:title" content="The story so far — The Soul Library">
<meta property="og:description" content="Chapter-by-chapter recaps of every serial — catch up in minutes.">
<meta property="og:type" content="website">
<meta name="description" content="Chapter-by-chapter recaps of every serial in the Soul Library — catch up in minutes.">
<link rel="canonical" href="https://gm5206663-bit.github.io/soul-library/recaps.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0e14'/%3E%3Cpath d='M16 5 L26 16 L16 27 L6 16 Z' fill='none' stroke='%23f0b429' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23f0b429'/%3E%3C/svg%3E">
<style>
body{background:#0a0e14;color:#c8d6e5;font:15px/1.75 ui-sans-serif,system-ui,Helvetica,sans-serif;margin:0}
.wrap{max-width:820px;margin:0 auto;padding:34px 20px 70px}
h1{font-size:25px;color:#e8f0fa;margin:0}h1 span{color:#f0b429}
.sub{color:#8b9db3;font-size:14px;margin:4px 0 8px}
a{color:#4fd1c5;text-decoration:none}
details{border:1px solid #223046;border-radius:10px;margin:14px 0;background:#0d1420}
summary{cursor:pointer;padding:13px 18px;font-weight:600;color:#e8f0fa;list-style:none;display:flex;justify-content:space-between;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary .cnt{color:#8b9db3;font-weight:400;font-size:13px}
.serial-body{padding:2px 18px 14px}
.row{padding:9px 0;border-top:1px solid #16202e}
.row:first-child{border-top:none}
.row .ch{color:#f0b429;font-weight:600;font-size:13px;letter-spacing:.4px}
.row .ti{color:#e8f0fa;font-weight:600}
.row .rc{color:#8b9db3;font-size:14px;margin-top:1px}
.row .rc b{color:#c8d6e5;font-weight:600}
.empty{color:#5d7186;font-size:13px;padding:6px 0 2px}
</style></head>
<body><div class="wrap">
<h1>The story so far <span>·</span> The Soul Library</h1>
<p class="sub">Every serial, chapter by chapter — built from the serials' own continuity ledgers. <a href="index.html">← The Library</a></p>
<div id="app"><p style="color:#5d7186">Loading the recaps…</p></div>
</div>
<script>
fetch('recaps_data.json').then(r=>r.json()).then(D=>{
const app=document.getElementById('app');
const order=['devouring_dragon','golden_lion','unraveled_tide','blue_silver','adaptive_prodigy'];
const names={devouring_dragon:'The Devouring Dragon',golden_lion:'The Golden Lion',unraveled_tide:'The Unraveled Tide',blue_silver:'Blue Silver',adaptive_prodigy:'The Adaptive Prodigy'};
app.innerHTML=order.filter(k=>D[k]).map((k,i)=>{
const s=D[k];
const rows=s.chapters.map(c=>{
const rc=c[2]?`<div class="rc">${c[2]}</div>`:'';
return `<div class="row"><span class="ch">CH ${c[0]}</span> <span class="ti">${c[1]}</span>${rc}</div>`;}).join('');
return `<details${i===0?' open':''}><summary><span>${names[k]||k}</span><span class="cnt">${s.chapters.length} chapters</span></summary><div class="serial-body">${rows}</div></details>`;
}).join('');
}).catch(e=>{document.getElementById('app').innerHTML='<p style="color:#c0392b">Could not load recaps_data.json — open this page from the site root.</p>'});
</script>
</body></html>
